title: My Blog
description: Writing for [module name]
theme: minima

# Posts live at /posts/post-title.html, so image links like ../assets/pic.png
# work both in Obsidian and on the website.
permalink: /posts/:title.html

# Turn links to .md files into links to the published pages,
# including links inside posts.
relative_links:
  enabled: true
  collections: true

exclude:
  - README.md
